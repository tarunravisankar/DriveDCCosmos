# RoboRacer action-policy SFT — Qwen3-VL-4B backbone for Orin Nano deployment.
#
# Identical training recipe to action_policy_roboracer_repro_v10 (8B) except:
#   - VLM backbone is Qwen3-VL-4B-Instruct (hidden=2560 vs 4096 for 8B)
#   - No BASE_CHECKPOINT_PATH / load_path needed — backbone loaded from local
#     Qwen3-VL-4B-Instruct HF safetensors via pretrained_weights.enabled=True
#   - data_parallel_shard_degree=4 × replicate=2 (same 8 GPUs, 2x replication
#     since 4B fits comfortably in 4-way shard at bf16 on 48GB A6000)
#   - Larger batch possible (4B uses less VRAM per rank)
#
# Env required:
#   WAN_VAE_PATH=$HOME/cosmos-framework/examples/checkpoints/wan22_vae/Wan2.2_VAE.pth
#   IMAGINAIRE_OUTPUT_ROOT=/scratch/tarunrav/cosmos-framework/outputs
#   ROBORACER_TRAIN_ROOT=/scratch/tarunrav/roboracer_lerobot_train
#   ROBORACER_EVAL_ROOT=/scratch/tarunrav/roboracer_lerobot_eval
#   (No BASE_CHECKPOINT_PATH — 4B uses pretrained_weights instead of DCP)

[job]
task         = "vfm"
experiment   = "action_policy_roboracer_4b"
project      = "cosmos3_action"
group        = "action_sft"
name         = "action_policy_roboracer_4b_v1"
wandb_mode   = "offline"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.compile]
enabled = false

[model.ema]
enabled = false

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [515000]
warm_up_steps = [200]

[trainer]
max_iter     = 515000
logging_iter = 10

[checkpoint]
load_path = ""
save_iter = 200

[dataloader_train]
max_samples_per_batch = 16   # 4B is smaller; can fit more per rank on 48GB A6000
